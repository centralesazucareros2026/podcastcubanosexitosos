<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador | Podcast</title><style>body{background:#191919;color:#f0e9df;font:16px Arial;max-width:900px;margin:35px auto;padding:20px}h1{color:#d1ac78}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:11px;margin:7px 0 16px;background:#292929;border:1px solid #d1ac78;color:white}textarea{min-height:90px}button{padding:12px;margin:5px;background:#d1ac78;color:#101010;border:0;cursor:pointer}section{border:1px solid #555;padding:16px;margin:12px 0}#status{white-space:pre-wrap}</style><h1>Administrar podcast</h1><p>Acceso privado. La clave no se guarda en el navegador ni en el repositorio.</p><label>URL del Worker<input id="api" placeholder="https://jolly-pine-00c3...workers.dev"></label><label>Clave administrativa<input id="secret" type="password" autocomplete="off"></label><button id="load">Cargar contenido</button><label>Página<select id="page"></select></label><div id="editor" hidden><label>Título<input id="title"></label><label>Subtítulo<textarea id="subtitle"></textarea></label><div id="cards"></div><button id="add">Añadir tarjeta</button><button id="save">Publicar cambios</button></div><p id="status" role="status"></p><script>
let data={};const $=id=>document.getElementById(id);const names=['index.html','02-about.html','03-episodes.html','04-episode-pages.html','05-guests.html','06-watch-listen.html','07-blog.html','08-newsletter.html','09-sponsors.html','10-books-merchandise.html','11-contact.html'];const editable=['index.html','03-episodes.html','04-episode-pages.html','05-guests.html','07-blog.html','08-newsletter.html','09-sponsors.html','10-books-merchandise.html','11-contact.html'];editable.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('page').append(o)});
function field(label,value,cb){const l=document.createElement('label');l.textContent=label;const e=document.createElement('input');e.value=value||'';e.addEventListener('input',()=>cb(e.value));l.append(e);return l}
function render(){const v=data[$('page').value];if(!v)return;$('title').value=v.title;$('subtitle').value=v.subtitle;const box=$('cards');box.replaceChildren();v.cards.forEach((c,i)=>{const s=document.createElement('section');const h=document.createElement('h3');h.textContent='Tarjeta '+(i+1);s.append(h,field('Título',c.title,x=>c.title=x));const l=document.createElement('label');l.textContent='Texto';const t=document.createElement('textarea');t.value=c.text||'';t.addEventListener('input',()=>c.text=t.value);l.append(t);s.append(l,field('Enlace URL (opcional)',c.url,x=>c.url=x),field('Texto del enlace',c.linkText,x=>c.linkText=x));const b=document.createElement('button');b.textContent='Eliminar tarjeta';b.onclick=()=>{v.cards.splice(i,1);render()};s.append(b);box.append(s)})}
$('page').onchange=render;$('title').oninput=e=>data[$('page').value].title=e.target.value;$('subtitle').oninput=e=>data[$('page').value].subtitle=e.target.value;$('add').onclick=()=>{data[$('page').value].cards.push({title:'Nueva tarjeta',text:'',url:'',linkText:'Ver más'});render()};
$('load').onclick=async()=>{try{const r=await fetch('site.json?v='+Date.now());if(!r.ok)throw Error('No se encuentra site.json');data=await r.json();$('editor').hidden=false;render();$('status').textContent='Contenido cargado'}catch(e){$('status').textContent=e.message}};
$('save').onclick=async()=>{const url=$('api').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(url))return $('status').textContent='Introduce la URL HTTPS del Worker';if(!$('secret').value)return $('status').textContent='Introduce la clave';$('status').textContent='Publicando...';try{const r=await fetch(url+'/publish',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({secret:$('secret').value,data})});const txt=await r.text();if(!r.ok)throw Error('Error '+r.status+': '+txt);$('status').textContent='Publicado en GitHub. Espera el despliegue de Pages.'}catch(e){$('status').textContent='No se pudo publicar: '+e.message+' (verifica Cloudflare Access y la URL del Worker)'}};
</script></html>
